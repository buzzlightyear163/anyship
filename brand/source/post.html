<!doctype html>
<html><head><meta charset="utf-8"><style>
  :root { --ink:#07080B; --white:#F4F5F7; --muted:#8A8F98; --blue:#3E64FF; --blue-hi:#5F7FFF; --wire:rgba(244,245,247,.55); }
  body { background:var(--ink); position:relative; color:var(--white); }
  .light { position:absolute; inset:0; background:
    radial-gradient(40% 60% at 72% 52%, rgba(62,100,255,.16), transparent 70%),
    radial-gradient(90% 100% at 60% 50%, #0D0F15, var(--ink) 72%); }
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.055) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.025) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.025) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    -webkit-mask-image: radial-gradient(70% 90% at 62% 50%, #000 15%, transparent 85%); }

  /* left column */
  .kicker { position:absolute; left:96px; top:96px; display:flex; align-items:center; gap:14px;
    font:500 18px/1 Mono; letter-spacing:.18em; color:var(--muted); }
  .kicker svg { height:30px; color:var(--white); }
  .kicker b { color:var(--white); font-weight:500; }
  h1 { position:absolute; left:96px; top:176px; margin:0; font:600 104px/0.98 Sans; letter-spacing:-.05em; }
  h1 em { font:400 120px/1 Accent; letter-spacing:-.01em; color:var(--blue-hi); font-style:normal; }
  .sub { position:absolute; left:96px; top:520px; width:560px; margin:0; font:400 31px/1.38 Sans; color:#B4B8C0; letter-spacing:-.01em; }
  .steps { position:absolute; left:96px; top:648px; display:flex; flex-direction:column; gap:16px; font:500 19px/1 Mono; letter-spacing:.14em; color:var(--muted); }
  .steps span { display:flex; align-items:center; gap:14px; }
  .steps i { width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-style:normal; font-size:12px; letter-spacing:0;
    border:1.5px dashed rgba(244,245,247,.45); color:var(--white); }
  .steps i.s { border:0; background:var(--white); color:var(--ink); }
  .steps i.b { border:0; background:var(--blue); color:#fff; }
  .meta { position:absolute; left:96px; right:96px; bottom:72px; padding-top:22px; border-top:1px solid rgba(255,255,255,.1);
    display:flex; justify-content:space-between; font:500 18px/1 Mono; letter-spacing:.18em; color:var(--muted); }
  .meta .live { display:inline-flex; align-items:center; gap:10px; color:var(--white); }
  .meta .live::before { content:''; width:8px; height:8px; border-radius:50%; background:#33D17A; box-shadow:0 0 10px rgba(51,209,122,.7); }

  /* the app window, half blueprint / half built */
  .win { position:absolute; left:868px; top:150px; width:636px; height:560px; }
  .win * { box-sizing:border-box; }
  .layer { position:absolute; inset:0; border-radius:20px; }
  .solid { clip-path: inset(-60px -60px -60px 288px); }
  .wire  { clip-path: inset(-60px 364px -60px -60px); }
  .line  { position:absolute; left:276px; top:-34px; width:16px; height:628px; background:var(--blue);
           box-shadow:0 0 40px rgba(62,100,255,.55); }
  .tag { position:absolute; left:276px; top:-78px; transform:translateX(-50%); margin-left:8px; padding:8px 12px; border-radius:8px;
         background:var(--blue); color:#fff; font:500 16px/1 Mono; letter-spacing:.12em; white-space:nowrap; }

  .ui { position:absolute; inset:0; border-radius:20px; overflow:hidden; display:grid; grid-template-rows:52px 1fr; }
  .bar { display:flex; align-items:center; gap:9px; padding:0 20px; }
  .bar .d { width:12px; height:12px; border-radius:50%; }
  .bar .t { margin-left:auto; margin-right:auto; width:160px; height:14px; border-radius:7px; transform:translateX(-24px); }
  .body { display:grid; grid-template-columns:168px 1fr; }
  .side { padding:22px 18px; display:flex; flex-direction:column; gap:14px; }
  .side .row { height:16px; border-radius:6px; }
  .side .row.sel { height:34px; border-radius:9px; }
  .main { padding:24px 26px; display:flex; flex-direction:column; gap:20px; }
  .lines .card { height:86px; border-radius:12px; width:78%; margin-top:2px; }
  .chips { display:flex; gap:8px; } .lines .chips span { width:54px; height:26px; border-radius:13px; }
  .msg { display:flex; gap:16px; align-items:flex-start; }
  .av { width:44px; height:44px; border-radius:50%; flex:none; }
  .lines { display:flex; flex-direction:column; gap:10px; flex:1; padding-top:4px; }
  .lines span { height:14px; border-radius:7px; }
  .composer { margin-top:auto; height:58px; border-radius:14px; display:flex; align-items:center; justify-content:flex-end; padding:0 10px; }
  .send { width:40px; height:40px; border-radius:10px; }

  /* built (solid) style */
  .s .ui, .s .bar .d, .s .bar .t, .s .side .row, .s .lines span, .s .av, .s .send, .s .composer, .s .card, .s .chips span { border:2px solid transparent; }
  .s .ui { border-color:#FFFFFF; background:#FFFFFF; box-shadow: 0 40px 80px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.06); }
  .s .bar { background:#F4F5F7; border-bottom:1px solid #E6E7EB; }
  .s .bar .d { background:#D6D8DE; } .s .bar .t { background:#E3E5EA; }
  .s .side { background:#F7F8FA; border-right:1px solid #ECEDF0; }
  .s .side .row { background:#DADDE3; } .s .side .row.sel { background:#E7ECFF; box-shadow: inset 0 0 0 1.5px #C8D3FF; }
  .s .lines span { background:#E2E4E9; } .s .lines span:first-child { background:#C3C7CF; }
  .s .av.a1 { background:#FFD7C2 } .s .av.a2 { background:#CFE0FF } .s .av.a3 { background:#D8F2DE }
  .s .composer { background:#F4F5F7; border-color:#E6E7EB; } .s .send { background:var(--blue); }
  .s .lines .card { background:linear-gradient(135deg,#DCE4FF,#F1EAFF 60%,#FFE9DD); }
  .s .lines .chips span { background:#F1F3F6; border-color:#E3E6EB; } .s .lines .chips span:first-child { background:#E8EDFF; border-color:#C8D3FF; }

  /* blueprint (wire) style */
  .w .ui { border:2px dashed var(--wire); }
  .w .bar { border-bottom:2px dashed rgba(244,245,247,.35); }
  .s .bar { border-bottom-width:2px; }
  .w .bar .d, .w .bar .t, .w .side .row, .w .lines span, .w .av, .w .send { border:2px dashed var(--wire); }
  .w .side { border-right:2px dashed rgba(244,245,247,.35); }
  .s .side { border-right-width:2px; }
  .w .composer, .w .lines .card, .w .lines .chips span { border:2px dashed var(--wire); }
</style></head>
<body>
  <div class="light"></div>
  <div class="grid"></div>

  <div class="kicker">
    <svg viewBox="16 2 168 196" xmlns="http://www.w3.org/2000/svg"><path d="M87 24H60A36 36 0 0 0 24 60V140A36 36 0 0 0 60 176H87" fill="none" stroke="currentColor" stroke-width="16" stroke-dasharray="24 13.18"/><rect x="93" y="2" width="14" height="196" fill="#3E64FF"/><path d="M113 16H140A44 44 0 0 1 184 60V140A44 44 0 0 1 140 184H113Z" fill="currentColor"/></svg>
    <b>ANYSHIP</b>
  </div>
  <h1>Describe<br>any app.<br><em>Ship it.</em></h1>
  <p class="sub">Launch its coin. Get one original file you own, in about 20 minutes.</p>
  <div class="steps">
    <span><i>1</i>DESCRIBE THE APP</span>
    <span><i class="b">2</i>LAUNCH THE COIN</span>
    <span><i class="s">3</i>GET THE FILE</span>
  </div>

  <div class="win" data-keep="window">
    <div class="layer w wire"><div class="ui">
      <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t"></span></div>
      <div class="body">
        <div class="side"><span class="row" style="width:70%"></span><span class="row sel"></span><span class="row" style="width:82%"></span><span class="row" style="width:60%"></span><span class="row" style="width:76%"></span></div>
        <div class="main">
          <div class="msg"><span class="av a1"></span><div class="lines"><span style="width:28%"></span><span style="width:86%"></span><span style="width:64%"></span></div></div>
          <div class="msg"><span class="av a2"></span><div class="lines"><span style="width:22%"></span><span style="width:72%"></span><span class="card"></span><div class="chips"><span></span><span></span></div></div></div>
          <div class="msg"><span class="av a3"></span><div class="lines"><span style="width:32%"></span><span style="width:84%"></span></div></div>
          <div class="composer"><span class="send"></span></div>
        </div>
      </div>
    </div></div>
    <div class="layer s solid"><div class="ui">
      <div class="bar"><span class="d"></span><span class="d"></span><span class="d"></span><span class="t"></span></div>
      <div class="body">
        <div class="side"><span class="row" style="width:70%"></span><span class="row sel"></span><span class="row" style="width:82%"></span><span class="row" style="width:60%"></span><span class="row" style="width:76%"></span></div>
        <div class="main">
          <div class="msg"><span class="av a1"></span><div class="lines"><span style="width:28%"></span><span style="width:86%"></span><span style="width:64%"></span></div></div>
          <div class="msg"><span class="av a2"></span><div class="lines"><span style="width:22%"></span><span style="width:72%"></span><span class="card"></span><div class="chips"><span></span><span></span></div></div></div>
          <div class="msg"><span class="av a3"></span><div class="lines"><span style="width:32%"></span><span style="width:84%"></span></div></div>
          <div class="composer"><span class="send"></span></div>
        </div>
      </div>
    </div></div>
    <div class="line"></div>
    <div class="tag">WRITING · 12:04 / 20:00</div>
  </div>

  <div class="meta">
    <span>$SHIP</span>
    <span class="live">LIVE ON PUMP.FUN</span>
    <span>SOLANA</span>
  </div>
</body></html>
