<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="bw.css">
<style>
  :root { --ink:#07080B; --white:#F4F5F7; --muted:#8A8F98; --blue:#3E64FF; --blue-hi:#5F7FFF; --mono: Mono; --green-ink:#4ADE80; }
  body { background:var(--ink); position:relative; color:var(--white); overflow:hidden; }
  .light { position:absolute; inset:0; background:
    radial-gradient(38% 55% at 74% 50%, rgba(62,100,255,.22), transparent 70%),
    radial-gradient(90% 100% at 60% 50%, #0D0F15, var(--ink) 72%); }
  .grid { position:absolute; inset:0;
    background-image:
      linear-gradient(to right, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.05) 1px, transparent 1px),
      linear-gradient(to right, rgba(255,255,255,.022) 1px, transparent 1px),
      linear-gradient(to bottom, rgba(255,255,255,.022) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px;
    -webkit-mask-image: radial-gradient(80% 90% at 40% 50%, #000 20%, transparent 85%); }

  /* the wall of apps being built */
  .wall { position:absolute; left:760px; top:-10px; width:1080px; height:920px; perspective:1900px;
    -webkit-mask-image: linear-gradient(90deg, #000 70%, transparent 98%), linear-gradient(#000, #000);
    mask-image: linear-gradient(90deg, #000 62%, transparent 96%); }
  .wall-in { position:absolute; left:40px; top:70px; display:grid; grid-template-columns:repeat(3, 300px); gap:44px 34px;
    transform: rotateY(-24deg) rotateX(9deg) rotateZ(-1.5deg); transform-origin: 0% 50%; transform-style: preserve-3d; }
  .cell { position:relative; padding-top:30px; }
  .cell .bw { width:300px; }
  .cell.dim { opacity:.62; }
  .cell.focus { filter: drop-shadow(0 30px 60px rgba(62,100,255,.35)); }
  .bw-title { font-size:9.5px; }
  .bw-tag { font-size:10px; }

  .kicker { position:absolute; left:96px; top:88px; display:flex; align-items:center; gap:14px;
    font:500 18px/1 Mono; letter-spacing:.18em; color:var(--muted); }
  .kicker svg { height:30px; color:var(--white); }
  .kicker b { color:var(--white); font-weight:500; }
  h1 { position:absolute; left:96px; top:172px; margin:0; font:600 112px/0.96 Sans; letter-spacing:-.052em; }
  h1 em { display:block; font:400 120px/1.02 Accent; letter-spacing:-.01em; color:var(--blue-hi); font-style:normal; }
  .sub { position:absolute; left:96px; top:438px; width:560px; margin:0; font:400 31px/1.4 Sans; color:#B4B8C0; letter-spacing:-.01em; }
  .count { position:absolute; left:96px; top:640px; display:flex; align-items:center; gap:14px; font:500 18px/1 Mono; letter-spacing:.16em; color:var(--muted); }
  .count b { color:var(--white); font-weight:500; }
  .count i { width:22px; height:22px; border-radius:6px; border:1.5px dashed rgba(244,245,247,.5); }
  .meta { position:absolute; left:96px; width:640px; bottom:72px; padding-top:22px; border-top:1px solid rgba(255,255,255,.1);
    display:flex; justify-content:space-between; font:500 18px/1 Mono; letter-spacing:.18em; color:var(--muted); }
  .meta b { color:var(--white); font-weight:500; }
</style></head>
<body>
  <div class="light"></div>
  <div class="grid"></div>

  <div class="wall" data-keep="wall">
    <div class="wall-in">
      <div class="cell dim"><div class="bw" data-t="video" data-p="0.18" data-file="reelcut.html"></div></div>
      <div class="cell"><div class="bw" data-t="chat" data-p="1" data-file="hearth.html"></div></div>
      <div class="cell dim"><div class="bw" data-t="design" data-p="0.45" data-file="framewise.html"></div></div>
      <div class="cell"><div class="bw" data-t="notes" data-p="0.82" data-file="quill.html"></div></div>
      <div class="cell focus"><div class="bw" data-t="assistant" data-p="0.58" data-file="lumen.html" data-tag="WRITE · 09:14 / 20:00"></div></div>
      <div class="cell dim"><div class="bw" data-t="browser" data-p="0.3" data-file="tabula.html"></div></div>
      <div class="cell dim"><div class="bw" data-t="player" data-p="0.66" data-file="driftwave.html"></div></div>
      <div class="cell"><div class="bw" data-t="photo" data-p="1" data-file="inkwell.html"></div></div>
      <div class="cell dim"><div class="bw" data-t="chat" data-p="0.1" data-file="your-app.html"></div></div>
    </div>
  </div>

  <div class="kicker">
    <svg viewBox="16 2 168 196" xmlns="http://www.w3.org/2000/svg"><path d="M87 24H60A36 36 0 0 0 24 60V140A36 36 0 0 0 60 176H87" fill="none" stroke="currentColor" stroke-width="16" stroke-dasharray="24 13.18"/><rect x="93" y="2" width="14" height="196" fill="#3E64FF"/><path d="M113 16H140A44 44 0 0 1 184 60V140A44 44 0 0 1 140 184H113Z" fill="currentColor"/></svg>
    <span>MEET <b>ANYSHIP</b></span>
  </div>
  <h1>Any app.<em>Your version.</em></h1>
  <p class="sub">Describe it, launch its coin, and an AI writes your own original version from scratch.</p>
  <div class="count"><i></i><span><b>123</b> PAID APPS TO REBUILD</span></div>

  <div class="meta">
    <span><b>$SHIP</b> · PUMP.FUN · SOLANA</span>
    
  </div>

  <script src="windows.js"></script>
  <script src="bwrender.js"></script>
</body></html>
